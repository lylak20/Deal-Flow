<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal Flow Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header .meta {
      font-size: 13px;
      color: #888;
    }

    main { padding: 32px; max-width: 1100px; margin: 0 auto; }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    button#fetch-btn {
      background: #0070f3;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button#fetch-btn:hover { background: #005bcc; }
    button#fetch-btn:disabled { background: #93c5fd; cursor: not-allowed; }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.1s;
      color: #555;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #0070f3;
      border-color: #0070f3;
      color: #fff;
    }

    .status {
      font-size: 13px;
      color: #888;
    }

    .status.error { color: #dc2626; }

    .table-wrap {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead th {
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }

    tbody tr {
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }

    td { padding: 14px 16px; vertical-align: middle; }

    .company-name { font-weight: 600; }

    .stage-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .stage-seed     { background: #dcfce7; color: #15803d; }
    .stage-a        { background: #dbeafe; color: #1d4ed8; }
    .stage-b        { background: #ede9fe; color: #6d28d9; }

    .amount { font-variant-numeric: tabular-nums; font-weight: 500; }

    a.url-link {
      color: #0070f3;
      text-decoration: none;
      font-size: 13px;
    }
    a.url-link:hover { text-decoration: underline; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .count { font-size: 13px; color: #888; }
  </style>
</head>
<body>

<header>
  <h1>Deal Flow Tracker</h1>
  <span class="meta" id="last-updated"></span>
</header>

<main>
  <div class="controls">
    <button id="fetch-btn" onclick="fetchUpdate()">Get an Update</button>
    <div class="filter-group">
      <button class="filter-btn active" data-stage="All" onclick="setFilter('All', this)">All</button>
      <button class="filter-btn" data-stage="Seed" onclick="setFilter('Seed', this)">Seed</button>
      <button class="filter-btn" data-stage="Series A" onclick="setFilter('Series A', this)">Series A</button>
      <button class="filter-btn" data-stage="Series B" onclick="setFilter('Series B', this)">Series B</button>
    </div>
    <span class="count" id="count"></span>
    <span class="status" id="status"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Stage</th>
          <th>Amount</th>
          <th>Company URL</th>
          <th>Article</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6" class="empty">Click "Get an Update" to load the latest funding rounds.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  const STORAGE_KEY = 'dealflow_results';
  let allResults = [];
  let activeFilter = 'All';

  function stageClass(stage) {
    if (stage === 'Seed') return 'stage-seed';
    if (stage === 'Series A') return 'stage-a';
    if (stage === 'Series B') return 'stage-b';
    return '';
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function shortUrl(url) {
    try {
      const u = new URL(url);
      return u.hostname.replace(/^www\./, '');
    } catch { return url; }
  }

  function renderTable() {
    const tbody = document.getElementById('table-body');
    const filtered = activeFilter === 'All' ? allResults : allResults.filter(r => r.stage === activeFilter);

    document.getElementById('count').textContent = filtered.length > 0 ? `${filtered.length} results` : '';

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">No funding rounds found for the selected filter.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td class="company-name">${escHtml(r.company)}</td>
        <td><span class="stage-badge ${stageClass(r.stage)}">${escHtml(r.stage)}</span></td>
        <td class="amount">${escHtml(r.amount)}</td>
        <td><a class="url-link" href="${escHtml(r.url)}" target="_blank" rel="noopener">${shortUrl(r.url)}</a></td>
        <td><a class="url-link" href="${escHtml(r.articleUrl)}" target="_blank" rel="noopener">Read →</a></td>
        <td>${formatDate(r.pubDate)}</td>
      </tr>
    `).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setFilter(stage, btn) {
    activeFilter = stage;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function loadFromStorage() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      const { results, fetchedAt } = JSON.parse(saved);
      allResults = results || [];
      updateLastUpdated(fetchedAt);
      renderTable();
    } catch {}
  }

  function saveToStorage(results, fetchedAt) {
    try {
      // Merge with existing — dedupe by company+stage+amount key
      const existing = allResults.slice();
      const existingKeys = new Set(existing.map(r => `${r.company}|${r.stage}|${r.amount}`));
      const newItems = results.filter(r => !existingKeys.has(`${r.company}|${r.stage}|${r.amount}`));
      allResults = [...newItems, ...existing];
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ results: allResults, fetchedAt }));
    } catch {}
  }

  function updateLastUpdated(iso) {
    if (!iso) return;
    const d = new Date(iso);
    document.getElementById('last-updated').textContent =
      `Last updated: ${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} at ${d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
  }

  async function fetchUpdate() {
    const btn = document.getElementById('fetch-btn');
    const statusEl = document.getElementById('status');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Fetching…';
    statusEl.textContent = '';
    statusEl.className = 'status';

    try {
      const res = await fetch('/api/fetch-funding');
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const { results, fetchedAt } = await res.json();

      saveToStorage(results, fetchedAt);
      updateLastUpdated(fetchedAt);
      renderTable();

      statusEl.textContent = `Fetched ${results.length} new rounds.`;
    } catch (e) {
      statusEl.textContent = `Error: ${e.message}`;
      statusEl.className = 'status error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Get an Update';
    }
  }

  loadFromStorage();
</script>
</body>
</html>
