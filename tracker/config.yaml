# News Tracker settings. Secrets live in environment variables, not here.

# Only articles published within this window are considered (URL dedup makes overlap harmless).
lookback_hours: 48

# Only the start of each article is sent to Gemini; funding details are almost always up top.
max_article_chars: 6000

# An article that fails extraction this many times is marked "failed" and no longer retried.
max_attempts_per_article: 3

# Same company + same round within this many days counts as the same funding event, so a company
# already in the sheet isn't added again when later articles mention the same round. A new round
# (e.g. Series A -> Series B) is still added as a new row.
dedup_window_days: 365

llm:
  # Which model reads the articles: "claude" or "gemini". Each needs its own API key in the environment.
  provider: claude
  # Used in order when the provider before it runs out of quota (spend limit, credits, daily cap).
  # A fallback whose API key isn't set is skipped with a warning.
  fallbacks: [gemini]
  claude:
    model: claude-haiku-5-5
    # Simple extraction doesn't need deep reasoning; "low" keeps output tokens (and cost) down.
    effort: low
    max_retries: 3
  gemini:
    # The free tier allows only ~20 requests/day per model: fine as a backup for one daily run.
    # Tried in order: the next model is used when one is overloaded (503) or out of daily quota.
    models: [gemini-3.8-flash, gemini-3.6-flash]
    min_seconds_between_calls: 4
    max_retries: 3

http:
  timeout_seconds: 20
  # Connect over IPv4 only. On networks with broken IPv6 every request otherwise stalls ~40s first.
  ipv4_only: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

# At most this many LLM calls per run. Articles left over stay "pending" and go first next run
# (after that day's priority-1 articles), so TechCrunch and PR Newswire are never crowded out.
max_llm_calls_per_run: 30

# One run fills two database tabs with the same columns (each source lists the tracks it feeds):
#   all:      "Raw Database"      - every sector, TechCrunch + PR Newswire + Crunchbase News
#   robotics: "Robotics Database" - robotics rounds only (the focus below), from every source
# An article is extracted once; its rounds go to "all" if its source feeds that track, and to
# "robotics" if the LLM marks them in_focus.
#
# The robotics track's sector definition:
focus:
  name: Robotics
  # Pre-LLM filter: an article must match one of these in its title or summary (case-insensitive regex)
  # as well as a funding keyword below. Broad on purpose; the LLM makes the final call.
  keywords:
    - 'robot'
    - '\bhumanoids?\b'
    - '\bembodied\b'
    - '\bphysical ai\b'
    - '\bdrones?\b'
    - '\buavs?\b'
    - '\bautonomous\b'
    - '\bself-driving\b'
    - '\bdriverless\b'
    - '\brobotaxis?\b'
    - '\blidar\b'
    - '\bexoskeletons?\b'
    - '\bcobots?\b'
    - '\bactuators?\b'
    - '\bmanipulat'
    - '\b(warehouse|factory|industrial|manufacturing) automation\b'
    - '\b(amrs?|agvs?)\b'
  # Given to the LLM to decide in_focus for each round.
  description: >-
    Robotics: companies building robots or their brains and parts. Include industrial, logistics,
    service, surgical and consumer robots; humanoids; Physical AI and robot foundation models;
    drones and delivery robots; autonomous driving and robotaxis; manufacturing and warehouse
    automation; robot components and software (actuators, sensors, lidar, simulation, robot
    operating software). Exclude defense and weapons systems (including military robots and drones),
    and AI or software that never controls a physical machine.
  # Category column values for in-focus rounds.
  categories: [Humanoids & Physical AI, Industrial Automation, Drones & Delivery, Autonomous Driving,
               Robot Components & Software, Other Robotics]

# priority: lower is processed first; TechCrunch and PR Newswire are 1.
# tracks: which database tabs the source feeds (see above). A source in "all" takes every funding
#   article; for "robotics" the article must also match focus.keywords.
# headline_only: the article page can't be read (Google News links), so only the headline is used.
sources:
  - name: TechCrunch
    url: https://techcrunch.com/tag/funding/feed/
    tracks: [all, robotics]
    priority: 1
  - name: TechCrunch
    url: https://techcrunch.com/category/venture/feed/
    tracks: [all, robotics]
    priority: 1
  - name: PR Newswire
    url: https://www.prnewswire.com/rss/financial-services-latest-news/venture-capital-list.rss
    tracks: [all, robotics]
    priority: 1
  - name: TechCrunch
    url: https://techcrunch.com/category/robotics/feed/
    tracks: [robotics]
    priority: 2
  - name: The Robot Report
    url: https://www.therobotreport.com/feed/
    tracks: [robotics]
    priority: 2
  - name: Robotics & Automation News
    url: https://roboticsandautomationnews.com/feed/
    tracks: [robotics]
    priority: 2
  - name: Crunchbase News
    url: https://news.crunchbase.com/feed/
    tracks: [all, robotics]
    priority: 2
  - name: Google News
    # Catch-all search across outlets (US, last day). Source column shows "<publisher> (via Google News)".
    url: https://news.google.com/rss/search?q=%28robotics+OR+robot+OR+humanoid+OR+drone+OR+autonomous%29+%28raises+OR+funding%29+when%3A1d&hl=en-US&gl=US&ceid=US:en
    tracks: [robotics]
    priority: 3
    headline_only: true
    # Stricter than the global keywords: a bare "raises" in headlines is often "raises doubts/toll".
    keywords:
      - '[$€£]\s?\d'
      - '\b(million|billion)\b'
      - '\bfunding\b'
      - '\bseries [a-h]\b'
      - '\b(pre-?)?seed\b'
  - name: VentureBeat
    url: https://venturebeat.com/feed/
    # Disabled: the feed answers with a bot challenge (HTTP 429) as of 2026-10-22.
    enabled: false

# An RSS item is a candidate if its title or summary matches any of these (case-insensitive regex);
# for the robotics track it must also match one of focus.keywords.
keywords:
  - '\brais(e|es|ed|ing)\b'
  - '\bfunding\b'
  - '\bfundrais(e|es|ed|ing)\b'
  - '\bseries [a-h]\b'
  - '\bpre-?seed\b'
  - '\bseed (round|funding|financing)\b'
  - '\bventure (funding|round|financing)\b'
  - '\b(secures?|closes?|lands?|nabs?|bags?)\b.{0,40}\$\s?\d'
  - '\binvests? (us)?\$'

# ---------------------------------------------------------------------------------------------------
# Sourcing (sourcing_main.py): finds emerging opportunities from free public data, scores them in code,
# and writes them to new tabs of the same sheet. Claude is used only for the short weekly partner brief
# and, if turned on, founding-team lookups.
sourcing:
  # Themes from the Deal Flow Dashboard agent. keywords classify text (case-insensitive) and drive the
  # OpenAlex paper search; github_topics are searched for new repositories.
  themes:
    AI Infrastructure:
      keywords: [inference, llm serving, model serving, gpu, vector database, distributed training, kv cache, quantization]
      github_topics: [llm-inference, inference-engine, vector-database, llmops]
    AI Agents:
      keywords: [ai agent, agentic, multi-agent, tool use, autonomous agent, model context protocol]
      github_topics: [ai-agents, agentic-ai, mcp-server]
    AI Coding:
      keywords: [code generation, coding agent, program synthesis, code llm, software engineering agent, code review]
      github_topics: [coding-agent, code-generation, ai-coding]
    Healthcare AI:
      keywords: [clinical, medical, healthcare, drug discovery, protein design, radiology, pathology]
      github_topics: [medical-ai, drug-discovery, bioinformatics]
    Robotics & Physical AI:
      # Same scope as the Robotics Database focus: robots, humanoids, drones, autonomous vehicles,
      # manufacturing and logistics automation, robot parts and software.
      keywords: [robot, robotic, robotics, humanoid, embodied, physical ai, manipulation, locomotion, legged,
                 dexterous, vision-language-action, robot learning, sim-to-real, drone, uav, quadrotor,
                 autonomous driving, autonomous vehicle, self-driving, warehouse automation,
                 industrial automation, exoskeleton]
      github_topics: [robotics, humanoid, embodied-ai]
    Semiconductor:
      keywords: [semiconductor, chip design, ai accelerator, photonic, fpga, asic, neuromorphic]
      github_topics: [fpga, chip-design, hardware-acceleration]
    Enterprise Software:
      keywords: [enterprise, workflow automation, erp, crm, data platform, document processing]
      github_topics: [workflow-automation, data-platform, enterprise-ai]

  research:
    lookback_months: 12
    # Research Scout and Lab Tracker cover only these themes (leave out to search every theme above).
    themes: [Robotics & Physical AI]
    papers_per_theme: 200  # per query (OpenAlex max); two queries per theme (tracked universities, company co-authors)
    # OpenAlex fields a paper's main topic must be in: 17 Computer Science, 22 Engineering. Keeps out e.g.
    # neuroscience "locomotion" or chemistry "self-driving laboratory" papers. Leave out for every field.
    fields: [17, 22]
    # Lab Tracker defaults from the Google Doc. Values are OpenAlex institution IDs (checked 2026-10-23).
    institutions:
      Stanford: I97018004
      MIT: I63966007
      Berkeley: I95457486
      CMU: I74973139
      Harvard: I136199984
      Caltech: I122411786
      Princeton: I20089843
      Georgia Tech: I130701444

  github:
    lookback_months: 12    # only repositories created within this window
    min_stars: 200
    repos_per_topic: 10
    # Star history for a new repo is rebuilt from GitHub once (needs GITHUB_TOKEN); bigger repos rely on
    # the daily snapshots. Capped per run to stay inside the API rate limit.
    bootstrap_max_stars: 3000
    bootstrap_per_run: 10
    # Big companies' repos and models aren't startup opportunities (GitHub and Hugging Face owner names).
    exclude_owners: [google, google-deepmind, google-research, microsoft, meta-llama, facebookresearch, nvidia,
                     NVIDIA, openai, anthropics, amazon-science, aws, awslabs, apple, alibaba, Qwen, QwenLM,
                     tencent, Tencent, bytedance, ByteDance-Seed, baidu, deepseek-ai, huggingface, ibm, IBM,
                     ibm-granite, intel, salesforce, Salesforce, mistralai, xai-org, samsung, lg-ai-research]

  huggingface:
    trending_limit: 50

  startups:
    # YC batches and funding rounds (Raw Database) within this window count as "recently formed".
    formation_months: 24
    early_rounds: [Pre-Seed, Seed, Series A]

  scoring:
    # Minimum total for Tier 1 / 2 / 3 (below: Tier 4 Watchlist). The Google Doc uses 90 / 75 / 60, but
    # founder and lab-spinout data aren't in free sources: a strong startup (YC + recent round + fast-growing
    # repo) reaches about 40-50, a strong lab about 30-35, a YC company alone about 12-16. Raise these when
    # founding_team lookups are on.
    tier_thresholds: [40, 28, 20]

  claude:
    model: claude-haiku-5-5
    # Weekly Partner Brief: one short Claude call on the chosen weekday (0 = Monday), about $0.002.
    weekly_brief: true
    brief_weekday: 0
    # Founding Team Tracker: web lookups for the top startups without team data. About $0.02-0.05 per
    # company with Haiku; off by default to protect the monthly API budget.
    founding_team: false
    founding_team_top_n: 5
